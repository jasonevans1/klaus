name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ci:
    uses: jasonevans1/laravel-factory/.github/workflows/tests.yml@v1
    with:
      factory-ref: v1
      php-version: "8.5"
      e2e: false
  lint:
